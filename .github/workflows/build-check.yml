# Builds every release target without publishing anything — for checking the
# build matrix after changing targets or dependencies.
name: build-check

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag/commit to build (empty = the branch selected above)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/reusable-build-matrix.yml # zizmor: ignore[self-repository] (the documented form)
    with:
      ref: ${{ inputs.ref }}

  summary:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          merge-multiple: true
          path: binaries
      - name: Built targets
        run: |
          ls binaries | sed 's/^/built: /'
