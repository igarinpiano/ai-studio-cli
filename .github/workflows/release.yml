# Publishes a release to GitHub Releases: builds every target, archives the
# binaries, and creates the release (and its v<version> tag) at the built
# commit. Manual only: Actions → release → Run workflow.
#
# Project names (binary, release title) come from .github/release.env;
# nothing in this file names the project.
#
# Nothing is published unless every target of the build matrix was built: the
# first build that fails stops the other builds and the release (see
# reusable-build-matrix.yml).
#
# Assets: <BIN>-<version>-<target>.tar.gz (.zip on Windows), SHA256SUMS, and
# install.sh / install.ps1, which download from these assets.
#
# `ref` builds an existing tag instead of the selected branch (e.g. to add
# binaries to an older release). If the GitHub Release already exists, its
# assets are replaced/added instead of creating a new release.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Expected version (e.g. 0.1.1). Must match Cargo.toml; empty skips the check"
        required: false
      ref:
        description: "Tag/commit to build (empty = the branch selected above)"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - name: Load release settings
        run: grep -E '^[A-Z_]+=' .github/release.env | tr -d '\r' >> "$GITHUB_ENV"
      - id: ver
        env:
          # Inputs go through env, never straight into the script (injection).
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          # (The version of BIN_PACKAGE as Cargo sees it, wherever it is
          # written — its own Cargo.toml or [workspace.package].)
          v="$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg p "$BIN_PACKAGE" '.packages[] | select(.name == $p) | .version')"
          if [ -z "$v" ]; then
            echo "::error::package $BIN_PACKAGE (BIN_PACKAGE in .github/release.env) is not in this workspace."
            exit 1
          fi
          if [ -n "$INPUT_VERSION" ] && [ "$INPUT_VERSION" != "$v" ]; then
            echo "::error::Cargo.toml version ($v) does not match the input ($INPUT_VERSION)."
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build:
    needs: check-version
    uses: ./.github/workflows/reusable-build-matrix.yml # zizmor: ignore[self-repository] (the documented form)
    with:
      ref: ${{ inputs.ref }}

  github-release:
    needs: [check-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release and upload its assets
      id-token: write  # sign the build provenance (Sigstore)
      attestations: write  # store the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - name: Load release settings
        run: grep -E '^[A-Z_]+=' .github/release.env | tr -d '\r' >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          merge-multiple: true
          path: binaries
      - name: Archive binaries
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          # (README*, LICENSE*, COPYING*: whichever the project has.)
          shopt -s nullglob
          docs=(README* LICENSE* COPYING*)
          mkdir -p release
          for t in binaries/*/; do
            t="${t%/}"; name="$BIN-$VERSION-$(basename "$t")"
            mkdir -p "pkg/$name"
            cp "${docs[@]}" "$t"/* "pkg/$name/"
            if [ -f "$t/$BIN.exe" ]; then
              (cd pkg && zip -qr "../release/$name.zip" "$name")
            else
              chmod +x "pkg/$name/$BIN"
              tar -czf "release/$name.tar.gz" -C pkg "$name"
            fi
          done
          cp install.sh install.ps1 release/
          (cd release && sha256sum * > SHA256SUMS)
          cat release/SHA256SUMS
      - name: Attest build provenance
        # Artifact attestations need a public repository (or GitHub
        # Enterprise Cloud for private ones).
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: Create the GitHub Release (or update its assets)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release v$VERSION exists; uploading/replacing assets"
            gh release upload "v$VERSION" release/* --clobber
          else
            # Uses tag v$VERSION if it exists, otherwise creates it at the built commit.
            target="$(git rev-parse HEAD)"
            # Only versions like 1.0.0-beta.1 are pre-releases: install.sh /
            # install.ps1 install the latest full release by default.
            prerelease=""
            [[ "$VERSION" == *-* ]] && prerelease="--prerelease"
            gh release create "v$VERSION" release/* --target "$target" --title "$DISPLAY_NAME v$VERSION" --generate-notes $prerelease
          fi
