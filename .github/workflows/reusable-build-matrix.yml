# Builds the release binaries of the CLI (BIN_PACKAGE / BIN in
# .github/release.env) for every target and uploads them as artifacts
# (bin-<target>). Shared by release.yml and build-check.yml; add or change
# targets here only. install.sh / install.ps1 pick from these targets (Linux
# uses the static musl builds), so keep them in step.
#
# - Native runners build macOS and Windows directly.
# - Linux uses cross (cross-rs): its images bring the C toolchain for each
#   target (ring compiles C/assembly) plus an old glibc. Native ubuntu-latest
#   builds would require a new glibc ("Check glibc floor").
# - `features:` (optional, per target) is added to the cargo/cross command
#   line, e.g. `features: --no-default-features --features foo`.
# - Every target is required, and the first build that fails stops the rest
#   (fail-fast): nothing is published unless every target was built. The
#   `complete` job at the end checks that each target left its binary and
#   names the ones that did not. To ship without a target, take it out of
#   the matrix.
name: build-matrix

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build (default: the triggering ref)"
        type: string
        default: ""

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          # (`features: ""` here only declares the field, so that the
          # matrix stays valid while no target sets one.)
          - { target: aarch64-apple-darwin, os: macos-latest, features: "" }
          - { target: x86_64-apple-darwin, os: macos-26-intel }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, cross: true, glibc: "2.28" }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest, cross: true, glibc: "2.28" }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, cross: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, cross: true }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    # (The matrix reaches the scripts through the environment, never pasted
    # into them.)
    env:
      TARGET: ${{ matrix.target }}
      FEATURES: ${{ matrix.features }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - name: Load release settings
        # (tr: a Windows checkout may have turned the file's line ends to CRLF.)
        run: grep -E '^[A-Z_]+=' .github/release.env | tr -d '\r' >> "$GITHUB_ENV"
      # rustup itself (on every runner) rather than an action that wraps it:
      # one third-party action fewer.
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --target "$TARGET"
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cross
      - name: Build (release, native)
        if: ${{ !matrix.cross }}
        # ($FEATURES is several words on purpose.)
        run: cargo build --release --locked -p "$BIN_PACKAGE" --target "$TARGET" $FEATURES
      - name: Build (release, cross)
        if: matrix.cross
        run: cross build --release --locked -p "$BIN_PACKAGE" --target "$TARGET" $FEATURES
      - name: Check glibc floor
        # Required glibc builds must run on RHEL 8 / Debian 10 (glibc 2.28).
        if: contains(matrix.target, '-linux-gnu')
        env:
          MAX_GLIBC: ${{ matrix.glibc }}
        run: |
          bin="target/$TARGET/release/$BIN"
          need="$(readelf -V --wide "$bin" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -V | tail -1)"
          echo "max GLIBC required by $TARGET: ${need:-none}"
          if [ -n "$MAX_GLIBC" ] && [ -n "$need" ] && [ "$(printf '%s\n%s\n' "$need" "$MAX_GLIBC" | sort -V | tail -1)" != "$MAX_GLIBC" ]; then
            echo "::error::$TARGET requires GLIBC_$need (> $MAX_GLIBC)"
            exit 1
          fi
      - name: Smoke test
        if: ${{ !matrix.cross }}
        run: |
          exe="$BIN"; [[ "$TARGET" == *windows* ]] && exe="$BIN.exe"
          "target/$TARGET/release/$exe" --version
      - name: Collect
        run: |
          mkdir -p "out/$TARGET"
          exe="$BIN"; [[ "$TARGET" == *windows* ]] && exe="$BIN.exe"
          cp "target/$TARGET/release/$exe" "out/$TARGET/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}
          path: out/

  # Every target of the matrix above, or none. A failed build already fails
  # the run; this also catches a build that succeeded without leaving its
  # binary, and lists what is missing after a fail-fast stop.
  complete:
    name: every target built
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      # (The matrix of the workflow that is running, not that of the ref it
      # builds: this file as it is here.)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/workflows/reusable-build-matrix.yml
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          merge-multiple: true
          path: binaries
      - name: Compare what was built with the matrix
        run: |
          wanted="$(grep -oE '\{ target: [A-Za-z0-9_-]+' .github/workflows/reusable-build-matrix.yml | awk '{print $3}' | sort -u)"
          built="$(ls binaries 2> /dev/null | sort -u)"
          missing="$(comm -23 <(echo "$wanted") <(echo "$built"))"
          echo "built $(echo "$built" | grep -c .) of $(echo "$wanted" | grep -c .) targets"
          [ -z "$missing" ] && exit 0
          for t in $missing; do echo "::error::not built: $t"; done
          echo "::error::Nothing is published with a target missing. Fix the build, or take the target out of the matrix."
          exit 1
